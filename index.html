<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maikurafu 3D - Voxel Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Outfit', sans-serif;
      color: #f3f4f6;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* クロスヘア（照準） */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      display: none; /* ポインターロック中のみ表示 */
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before {
      top: 4px;
      left: 0;
      width: 10px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 4px;
      width: 2px;
      height: 10px;
    }

    /* ポインターロック・メニュー画面 */
    #menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.7);
      backdrop-filter: blur(8px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    #menu-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1rem;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    #start-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      color: white;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
      width: 100%;
      margin-bottom: 24px;
    }

    #start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.5);
    }

    #start-btn:active {
      transform: translateY(1px);
    }

    .instructions {
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
    }

    .instructions h3 {
      font-size: 0.95rem;
      color: #e5e7eb;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .instruction-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* プレイ中HUD */
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    .hud-panel {
      background: rgba(11, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #d1d5db;
    }

    .hud-row {
      margin-bottom: 4px;
    }

    .hud-row:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <!-- 3Dレンダリング用のキャンバスコンテナ -->
  <div id="canvas-container"></div>

  <!-- クロスヘア -->
  <div id="crosshair"></div>

  <!-- メニュー画面 / ポインターロック用 -->
  <div id="menu-overlay">
    <div id="menu-card">
      <h1>MAIKURAFU 3D</h1>
      <p class="subtitle">TypeScript & Three.js Voxel Game</p>
      
      <button id="start-btn">ゲームスタート</button>
      
      <div class="instructions">
        <h3>コントロール</h3>
        <div class="instruction-row">
          <span>移動</span>
          <span class="key-badge">W</span>
          <span class="key-badge">A</span>
          <span class="key-badge">S</span>
          <span class="key-badge">D</span>
        </div>
        <div class="instruction-row">
          <span>ジャンプ</span>
          <span class="key-badge">Space</span>
        </div>
        <div class="instruction-row">
          <span>視点移動</span>
          <span>マウス移動</span>
        </div>
        <div class="instruction-row">
          <span>ブロックを削る / 壊す</span>
          <span>左クリック</span>
        </div>
        <div class="instruction-row">
          <span>ブロックを設置</span>
          <span>右クリック</span>
        </div>
        <div class="instruction-row">
          <span>メニューに戻る</span>
          <span class="key-badge">Esc</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 画面左下のHUD -->
  <div id="hud">
    <div class="hud-panel">
      <div class="hud-row">座標: <span id="pos-display">0.0, 0.0, 0.0</span></div>
      <div class="hud-row">アクティブチャンク数: <span id="chunks-display">0</span></div>
      <div class="hud-row">物理ボディ数: <span id="bodies-display">0</span></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
